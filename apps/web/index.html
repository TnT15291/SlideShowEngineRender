    <meta charset="UTF-8" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter/Playfair Display were referenced by name in the Tailwind theme
      (index.css) but never actually loaded as web fonts, so every browser
      silently fell back to Georgia/Segoe UI for ALL text. That fallback path
      is where couple names with Vietnamese diacritics (e.g. "Tiến") could
      render with a glyph substituted from a different font mid-word — Google
      Fonts' own files are the ones actually verified for full Vietnamese
      coverage, so loading them for real is the fix, not a font-family typo.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
