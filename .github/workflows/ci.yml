name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Create synthetic test album
        run: node test/fixtures/create-ci-media.mjs
      - name: npm run check
        shell: bash
        run: npm run check 2>&1 | tee check.log
      # Raise what failed as annotations, so the reason shows on the run page
      # (and to the public API) without opening the log.
      - name: Surface failures
        if: failure()
        run: |
          grep -E "^not ok|error TS|^npm error|^\s+error: " check.log | head -20 | sed 's/^/::error::/' || true
